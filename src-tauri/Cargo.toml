[package]
name = "aerial-manager"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSDistributedNotificationCenter", "NSOperation", "NSString", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace"] }
